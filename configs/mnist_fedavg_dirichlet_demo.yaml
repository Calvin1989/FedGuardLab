metadata:
  name: "MNIST FedAvg Dirichlet Demo"
  description: "FedAvg with Dirichlet Non-IID data partition"
  category: "baseline"
  tags:
    - mnist
    - fedavg
    - dirichlet
    - non-iid

experiment:
  name: "mnist_fedavg_dirichlet_demo"
  seed: 42
  rounds: 3

training:
  mode: "real"
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.01
  max_train_samples: 5000
  max_test_samples: 1000

federated:
  num_clients: 5
  malicious_clients: 0
  aggregation: "fedavg"

dataset:
  name: "mnist"
  partition: "dirichlet"
  alpha: 0.5

attack:
  type: "none"
  source_label: null
  target_label: null

defense:
  type: "none"

metrics:
  - accuracy
  - loss
