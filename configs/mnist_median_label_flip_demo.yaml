metadata:
  name: "MNIST Median Label Flip"
  description: "Label flipping attack with Median defense"
  category: "defense"
  tags:
    - mnist
    - median
    - label_flipping

experiment:
  name: "mnist_median_label_flip_demo"
  seed: 42
  rounds: 3

training:
  mode: "real"
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.01
  max_train_samples: 5000
  max_test_samples: 1000

federated:
  num_clients: 5
  malicious_clients: 2
  aggregation: "median"

dataset:
  name: "mnist"
  partition: "iid"
  alpha: null

attack:
  type: "label_flipping"
  source_label: 1
  target_label: 7

defense:
  type: "median"

metrics:
  - accuracy
  - loss
  - attack_success_rate
