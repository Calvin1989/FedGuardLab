metadata:
  name: "MNIST Trimmed Mean Label Flip"
  description: "Label flipping attack with Trimmed Mean defense"
  category: "defense"
  tags:
    - mnist
    - trimmed_mean
    - label_flipping

experiment:
  name: "mnist_trimmed_mean_label_flip_demo"
  seed: 42
  rounds: 3

training:
  mode: "real"
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.01
  max_train_samples: 5000
  max_test_samples: 1000

federated:
  num_clients: 5
  malicious_clients: 2
  aggregation: "trimmed_mean"

dataset:
  name: "mnist"
  partition: "iid"
  alpha: null

attack:
  type: "label_flipping"
  source_label: 1
  target_label: 7

defense:
  type: "trimmed_mean"
  trim_ratio: 0.2

metrics:
  - accuracy
  - loss
  - attack_success_rate
