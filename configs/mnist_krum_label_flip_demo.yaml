experiment:
  name: "mnist_krum_label_flip_demo"
  seed: 42
  rounds: 3

training:
  mode: "real"
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.01
  max_train_samples: 5000
  max_test_samples: 1000

federated:
  num_clients: 7
  malicious_clients: 2
  aggregation: "krum"

dataset:
  name: "mnist"
  partition: "iid"
  alpha: null

attack:
  type: "label_flipping"
  source_label: 1
  target_label: 7

defense:
  type: "krum"
  krum_malicious_clients: 2

metrics:
  - accuracy
  - loss
  - attack_success_rate
