experiment:
  name: "mnist_krum_backdoor_demo"
  seed: 42
  rounds: 3

training:
  mode: "real"
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.01
  max_train_samples: 5000
  max_test_samples: 1000

federated:
  num_clients: 7
  malicious_clients: 2
  aggregation: "krum"

dataset:
  name: "mnist"
  partition: "iid"
  alpha: null

attack:
  type: "backdoor"
  source_label: null
  target_label: 7
  poison_fraction: 0.5
  trigger_size: 4
  trigger_value: 2.8

defense:
  type: "krum"
  krum_malicious_clients: 2

metrics:
  - accuracy
  - loss
  - attack_success_rate
