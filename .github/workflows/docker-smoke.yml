name: Docker Smoke

on:
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run regression tests
        run: |
          python -m pytest tests/ -v

      - name: Validate Docker Compose config
        run: |
          docker compose config

      - name: Build Docker Compose services
        run: |
          docker compose build

      - name: Start Docker Compose services
        run: |
          docker compose up -d

      - name: Wait for backend health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 90
          last_error = None

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3) as response:
                      if response.status == 200:
                          print("Backend is healthy")
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)

          raise SystemExit(f"Backend did not become healthy: {last_error}")
          PY

      - name: Run API smoke test
        run: |
          python api_smoke_test.py

      - name: Run finished-job smoke test
        shell: bash
        run: |
          set -euo pipefail
          python api_smoke_test.py --wait-finished --write-finished-job-id smoke_finished_job_id.txt
          FINISHED_JOB_ID="$(cat smoke_finished_job_id.txt)"
          echo "FINISHED_JOB_ID=${FINISHED_JOB_ID}" >> "$GITHUB_ENV"
          echo "Finished job id: ${FINISHED_JOB_ID}"

      - name: Restart backend
        run: |
          docker compose restart backend

      - name: Wait for backend health after restart
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 90
          last_error = None

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3) as response:
                      if response.status == 200:
                          print("Backend is healthy after restart")
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)

          raise SystemExit(f"Backend did not become healthy after restart: {last_error}")
          PY

      - name: Run recovery smoke test
        run: |
          python api_smoke_test.py --check-recovery "$FINISHED_JOB_ID"

      - name: Tear down Docker Compose services
        if: always()
        run: |
          docker compose down
