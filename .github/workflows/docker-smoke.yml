name: Docker Smoke

on:
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate Docker Compose config
        run: |
          docker compose config

      - name: Build Docker Compose services
        run: |
          docker compose build

      - name: Start Docker Compose services
        run: |
          docker compose up -d

      - name: Wait for backend health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 90
          last_error = None

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3) as response:
                      if response.status == 200:
                          print("Backend is healthy")
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)

          raise SystemExit(f"Backend did not become healthy: {last_error}")
          PY

      - name: Run API smoke test
        run: |
          python api_smoke_test.py

      - name: Run finished-job smoke test
        shell: bash
        run: |
          set -euo pipefail
          python api_smoke_test.py --wait-finished | tee smoke_wait.log
          finished_job_id="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("smoke_wait.log").read_text(encoding="utf-8")
          match = re.search(r"\[OK\]\s+job\s+([0-9a-fA-F-]+)\s+finished\s+with", text)
          if not match:
              raise SystemExit("Could not find finished job id in smoke_wait.log")
          print(match.group(1))
          PY
          )"
          echo "FINISHED_JOB_ID=${finished_job_id}" >> "$GITHUB_ENV"
          echo "Finished job id: ${finished_job_id}"

      - name: Restart backend
        run: |
          docker compose restart backend

      - name: Wait for backend health after restart
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 90
          last_error = None

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3) as response:
                      if response.status == 200:
                          print("Backend is healthy after restart")
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)

          raise SystemExit(f"Backend did not become healthy after restart: {last_error}")
          PY

      - name: Run recovery smoke test
        run: |
          python api_smoke_test.py --check-recovery "$FINISHED_JOB_ID"

      - name: Tear down Docker Compose services
        if: always()
        run: |
          docker compose down
